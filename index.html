<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LINKCAM</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff;min-height:100vh}main{width:min(760px,100%);margin:auto;padding:28px 18px 48px}h1{font-size:36px;margin:0 0 4px;letter-spacing:.04em}.sub{opacity:.68;margin-bottom:24px}.card{background:#101d30;border:1px solid #22334b;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #0003}h2{margin-top:0}input,button{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #334963;background:#091524;color:#fff;font-size:16px}button{margin-top:10px;background:#1d6cff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#18283e}button:disabled{opacity:.45}.hidden{display:none}.status{margin-top:12px;line-height:1.6}.code{font-size:22px;letter-spacing:2px;font-weight:800;text-align:center;padding:16px;margin-top:12px;background:#091524;border-radius:12px;word-break:break-all}.video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:14px;margin-top:16px}.small{font-size:13px;opacity:.58;line-height:1.6;margin-top:12px}.ok{color:#7dffb2}.err{color:#ff8f8f}.name{font-weight:700}.sep{height:1px;background:#22334b;margin:20px 0}
</style>
</head>
<body>
<main>
<h1>LINKCAM</h1>
<div class="sub">スマホ・iPadをカメラにして、PC・スマホ・タブレットから見る</div>

<div id="setup" class="card">
<h2>端末を選択</h2>
<button onclick="showCamera()">この端末をカメラにする</button>
<button class="secondary" onclick="showViewer()">この端末でカメラを見る</button>
</div>

<div id="camera" class="card hidden">
<h2>カメラ登録</h2>
<input id="camName" placeholder="例：スマホ・リビング" autocomplete="off">
<button id="startBtn" onclick="startCamera()">登録してカメラ開始</button>
<div id="camStatus" class="status"></div>
<div id="myCode" class="code hidden"></div>
<button id="copyBtn" class="secondary hidden" onclick="copyId()">接続コードをコピー</button>
<div class="small">このページを開いたままにしてください。画面ロックやバックグラウンド移行時は、端末の仕様でカメラが停止する場合があります。</div>
</div>

<div id="viewer" class="card hidden">
<h2>カメラを見る</h2>
<input id="peerId" placeholder="カメラ側の接続コード" autocomplete="off">
<button id="connectBtn" onclick="connectViewer()">接続</button>
<div id="viewStatus" class="status"></div>
<video id="remote" class="video" autoplay playsinline></video>
<div class="small">カメラ側に表示された接続コードを入力してください。</div>
</div>
</main>

<script>
let peer=null, stream=null, activeCalls=[];
const $=id=>document.getElementById(id);
const iceConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};

function showCamera(){ $('setup').classList.add('hidden'); $('camera').classList.remove('hidden'); $('camName').value=localStorage.getItem('linkcam-camera-name')||''; }
function showViewer(){ $('setup').classList.add('hidden'); $('viewer').classList.remove('hidden'); }
function setStatus(el,msg,kind=''){ el.textContent=msg; el.className='status '+kind; }

function makePeer(){
  return new Peer({config:iceConfig,debug:1});
}

async function startCamera(){
  const name=$('camName').value.trim()||'カメラ端末';
  localStorage.setItem('linkcam-camera-name',name);
  $('startBtn').disabled=true;
  setStatus($('camStatus'),'カメラを起動しています…');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    $('startBtn').disabled=false;
    setStatus($('camStatus'),'カメラを使用できません: '+(e.message||e.name),'err');
    return;
  }
  peer=makePeer();
  peer.on('open',id=>{
    $('myCode').textContent=id;
    $('myCode').classList.remove('hidden');
    $('copyBtn').classList.remove('hidden');
    setStatus($('camStatus'),name+' として待機中。PC側からこのコードで接続してください。','ok');
  });
  peer.on('call',call=>{
    try{
      call.answer(stream);
      activeCalls.push(call);
      call.on('close',()=>{activeCalls=activeCalls.filter(x=>x!==call)});
      call.on('error',()=>{});
    }catch(e){setStatus($('camStatus'),'接続処理でエラーが発生しました。','err')}
  });
  peer.on('disconnected',()=>{setStatus($('camStatus'),'サーバーから切断されました。再接続中…','err');try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{setStatus($('camStatus'),'接続エラー: '+(e.type||e.message),'err')});
}

function createDummyStream(){
  const canvas=document.createElement('canvas');canvas.width=2;canvas.height=2;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,2,2);
  return canvas.captureStream(1);
}

function connectViewer(){
  const id=$('peerId').value.trim();
  if(!id){setStatus($('viewStatus'),'接続コードを入力してください。','err');return}
  if(peer){try{peer.destroy()}catch(e){}}
  $('connectBtn').disabled=true;
  $('remote').srcObject=null;
  setStatus($('viewStatus'),'カメラに接続しています…');
  peer=makePeer();
  peer.on('open',()=>{
    // PeerJSの発信側にも映像トラックを持たせ、Safari/Chrome/PC間でWebRTCの映像受信を安定させる。
    const dummy=createDummyStream();
    const call=peer.call(id,dummy);
    if(!call){$('connectBtn').disabled=false;setStatus($('viewStatus'),'接続を開始できませんでした。','err');return}
    call.on('stream',remoteStream=>{
      $('remote').srcObject=remoteStream;
      $('remote').play().catch(()=>{});
      setStatus($('viewStatus'),'接続しました。カメラ映像を受信中です。','ok');
      $('connectBtn').disabled=false;
    });
    call.on('close',()=>{setStatus($('viewStatus'),'カメラとの接続が切れました。','err');$('connectBtn').disabled=false});
    call.on('error',e=>{setStatus($('viewStatus'),'接続エラー: '+(e.type||e.message),'err');$('connectBtn').disabled=false});
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{
    let msg=e.type||e.message||'unknown';
    if(msg==='peer-unavailable') msg='カメラ端末が見つかりません。カメラ側のページが開いたままか、接続コードが正しいか確認してください。';
    setStatus($('viewStatus'),'接続エラー: '+msg,'err');
    $('connectBtn').disabled=false;
  });
}

async function copyId(){
  const id=$('myCode').textContent;
  try{await navigator.clipboard.writeText(id);setStatus($('camStatus'),'接続コードをコピーしました。','ok')}catch(e){setStatus($('camStatus'),'コピーできませんでした。コードを長押し/選択してコピーしてください。','err')}
}
</script>
</body>
</html>
