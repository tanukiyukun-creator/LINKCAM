<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LINKCAM</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#07111f;color:#fff;min-height:100vh}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:36px;margin:0}.sub{opacity:.7;margin:4px 0 22px}.card{background:#101d30;border:1px solid #263a54;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 12px 30px #0003}button,input{width:100%;padding:15px;border-radius:13px;border:1px solid #38516e;background:#091524;color:#fff;font-size:17px}button{margin-top:10px;background:#216cff;border:0;font-weight:750}button.secondary{background:#182b43}.hidden{display:none}.status{margin-top:12px;opacity:.82}.qr{display:flex;justify-content:center;background:#fff;padding:16px;border-radius:16px;margin:16px auto;width:max-content}.qr canvas,.qr img{display:block}.code{font-size:12px;word-break:break-all;opacity:.6;text-align:center;margin-top:8px}.scanbox{position:relative;background:#000;border-radius:16px;overflow:hidden;margin-top:14px}.scanbox video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}.scanline{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#2d8cff;box-shadow:0 0 12px #2d8cff}.video{width:100%;background:#000;border-radius:16px;max-height:70vh}.small{font-size:13px;opacity:.58;margin-top:12px;line-height:1.5}.back{background:#182b43}.device{font-size:20px;font-weight:700;margin-top:8px}</style></head><body><main><h1>LINKCAM</h1><div class="sub">QRコードで簡単接続</div><section id="setup" class="card"><h2>端末を選択</h2><button onclick="show('camera')">この端末をカメラにする</button><button class="secondary" onclick="show('viewer')">カメラ映像を見る</button></section><section id="camera" class="card hidden"><h2>カメラ登録</h2><input id="camName" placeholder="例：iPad・リビング"><button onclick="startCamera()">登録してカメラ開始</button><div id="camStatus" class="status"></div><div id="qrArea" class="hidden"><div class="device" id="deviceName"></div><div id="qrcode" class="qr"></div><div id="myCode" class="code"></div></div><button class="back" onclick="location.reload()">戻る</button><div class="small">カメラ側はこのページを開いたまま待機してください。</div></section><section id="viewer" class="card hidden"><h2>カメラ映像を見る</h2><button onclick="startScanner()">📷 QRコードを読み取る</button><div id="scanner" class="scanbox hidden"><video id="scanVideo" autoplay muted playsinline></video><div class="scanline"></div></div><canvas id="scanCanvas" class="hidden"></canvas><div id="scanStatus" class="status">QRコードを読み取ると接続を開始します。</div><input id="peerId" placeholder="QRが使えない場合のみ接続IDを入力"><button class="secondary" onclick="connectViewer()">接続IDで接続</button><video id="remote" class="video" autoplay playsinline controls></video><button class="back" onclick="location.reload()">戻る</button></section></main><script>let peer,stream,call,scanStream,scanning=false;const $=id=>document.getElementById(id);function show(x){$('setup').classList.add('hidden');$(x).classList.remove('hidden')}function startCamera(){const name=$('camName').value.trim()||'iPad';$('camStatus').textContent='カメラを起動しています…';peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',id=>{localStorage.setItem('linkcam-device-name',name);$('camStatus').textContent='カメラ待機中';$('deviceName').textContent=name;$('qrArea').classList.remove('hidden');$('myCode').textContent=id;new QRCode($('qrcode'),{text:'LINKCAM|'+encodeURIComponent(name)+'|'+id,width:220,height:220,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})});peer.on('call',c=>{if(stream){c.answer(stream)}else{c.close()}});peer.on('error',e=>$('camStatus').textContent='接続エラー: '+e.type);navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s}).catch(e=>$('camStatus').textContent='カメラを使用できません: '+e.message)}async function startScanner(){if(scanning)return;scanning=true;$('scanner').classList.remove('hidden');$('scanStatus').textContent='QRコードをカメラに映してください';try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('scanVideo').srcObject=scanStream;requestAnimationFrame(scanLoop)}catch(e){scanning=false;$('scanStatus').textContent='QR読み取り用カメラを使用できません: '+e.message}}function stopScanner(){scanning=false;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}function scanLoop(){if(!scanning)return;const v=$('scanVideo'),c=$('scanCanvas');if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);const img=x.getImageData(0,0,c.width,c.height);const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});if(r&&r.data.startsWith('LINKCAM|')){const a=r.data.split('|');const name=decodeURIComponent(a[1]||'iPad');const id=a.slice(2).join('|');$('peerId').value=id;$('scanStatus').textContent=name+' を認識しました。接続しています…';stopScanner();$('scanner').classList.add('hidden');connectViewer();return}}requestAnimationFrame(scanLoop)}function connectViewer(){const id=$('peerId').value.trim();if(!id)return;$('scanStatus').textContent='接続しています…';if(peer)peer.destroy();peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',()=>{call=peer.call(id,new MediaStream());call.on('stream',s=>{$('remote').srcObject=s;$('scanStatus').textContent='接続しました'});call.on('close',()=>{$('scanStatus').textContent='切断されました'});call.on('error',e=>$('scanStatus').textContent='接続エラー: '+e.type)});peer.on('error',e=>$('scanStatus').textContent='接続エラー: '+e.type)}window.addEventListener('beforeunload',stopScanner);</script></body></html>
