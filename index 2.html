<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKCAM</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><style>body{margin:0;font-family:system-ui,sans-serif;background:#07111f;color:#fff;min-height:100vh}main{max-width:720px;margin:auto;padding:28px 18px}h1{font-size:34px;margin:0 0 6px}.sub{opacity:.7;margin-bottom:26px}.card{background:#101d30;border:1px solid #22334b;border-radius:18px;padding:20px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #334963;background:#091524;color:#fff;font-size:16px}button{margin-top:10px;background:#1d6cff;border:0;font-weight:700}button:disabled{opacity:.45}.hidden{display:none}.status{margin-top:12px;opacity:.75}.code{font-size:28px;letter-spacing:4px;font-weight:800;text-align:center;padding:16px}.video{width:100%;background:#000;border-radius:14px;max-height:70vh}.small{font-size:13px;opacity:.6}.qr{display:flex;justify-content:center;background:#fff;padding:16px;border-radius:14px;margin:14px auto;width:max-content}.scanner{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;border-radius:14px}.scanbox{position:relative;margin-top:12px}.scanbox:after{content:"";position:absolute;left:18%;right:18%;top:20%;bottom:20%;border:2px solid #1d6cff;border-radius:16px;pointer-events:none}</style></head><body><main><h1>LINKCAM</h1><div class="sub">iPadをカメラにして、スマホ・PCから見る</div><div id="setup" class="card"><h2>端末を選択</h2><button onclick="showCamera()">この端末をカメラにする</button><button onclick="showViewer()">カメラ映像を見る</button></div><div id="camera" class="card hidden"><h2>カメラ登録</h2><input id="camName" placeholder="例：iPad・リビング"><button onclick="startCamera()">登録してカメラ開始</button><div id="camStatus" class="status"></div><div id="myCode" class="code hidden"></div><div id="qr" class="qr hidden"></div><div class="small">この画面はカメラ待機用です。Safariのカメラ表示・システム表示は端末側の仕様により消せません。</div></div><div id="viewer" class="card hidden"><h2>カメラを見る</h2><button onclick="startScanner()">📷 QRコードを読み取る</button><div id="scannerArea" class="hidden"><div class="scanbox"><video id="scanVideo" class="scanner" autoplay playsinline muted></video></div><canvas id="scanCanvas" class="hidden"></canvas><button onclick="stopScanner()">読み取りを終了</button></div><input id="peerId" placeholder="QR読み取り後に自動入力" readonly><button onclick="connectViewer()">接続</button><div id="viewStatus" class="status"></div><video id="remote" class="video" autoplay playsinline controls></video></div></main><script>let peer,stream,call,scanStream,scanTimer;const $=id=>document.getElementById(id);function showCamera(){$('setup').classList.add('hidden');$('camera').classList.remove('hidden')}function showViewer(){$('setup').classList.add('hidden');$('viewer').classList.remove('hidden')}function startCamera(){const name=$('camName').value.trim()||'iPad';$('camStatus').textContent='カメラを起動しています…';peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',id=>{$('camStatus').textContent=name+' として待機中';$('myCode').textContent=id;$('myCode').classList.remove('hidden');$('qr').classList.remove('hidden');$('qr').innerHTML='';new QRCode($('qr'),{text:id,width:220,height:220,colorDark:'#000000',colorLight:'#ffffff'});});peer.on('error',e=>{$('camStatus').textContent='接続エラー: '+(e.type||e.message||e)});peer.on('call',c=>{if(stream){c.answer(stream);c.on('error',e=>{$('camStatus').textContent='映像接続エラー: '+(e.type||e.message||e)})}else{c.close()}});navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s;}).catch(e=>{$('camStatus').textContent='カメラを使用できません: '+e.message})}function startScanner(){if(!navigator.mediaDevices?.getUserMedia){$('viewStatus').textContent='このブラウザではカメラを使用できません';return}$('scannerArea').classList.remove('hidden');$('viewStatus').textContent='QRコードをカメラに映してください';navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(s=>{scanStream=s;$('scanVideo').srcObject=s;scanLoop()}).catch(e=>{$('viewStatus').textContent='QR読み取りカメラを使用できません: '+e.message})}function scanLoop(){if(!scanStream)return;const v=$('scanVideo'),c=$('scanCanvas');if(v.readyState>=2){c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,c.width,c.height);const img=x.getImageData(0,0,c.width,c.height);const r=window.jsQR?.(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});if(r?.data){$('peerId').value=r.data;stopScanner();$('viewStatus').textContent='QRコードを読み取りました。接続を開始できます。';return}}scanTimer=requestAnimationFrame(scanLoop)}function stopScanner(){if(scanTimer)cancelAnimationFrame(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}$('scanVideo').srcObject=null;$('scannerArea').classList.add('hidden')}function createBlankStream(){
  const canvas=document.createElement('canvas');
  canvas.width=16; canvas.height=16;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,16,16);
  const stream=canvas.captureStream(1);
  return stream;
}

function connectViewer(){const id=$('peerId').value.trim();if(!id)return;$('viewStatus').textContent='接続しています…';peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',()=>{
  $('viewStatus').textContent='接続要求を送信しています…';
  call=peer.call(id, createBlankStream(), {metadata:{role:'viewer'}});
  if(!call){$('viewStatus').textContent='接続を開始できませんでした';return;}
  call.on('stream',s=>{$('remote').srcObject=s;$('viewStatus').textContent='接続しました';});
  call.on('close',()=>{$('viewStatus').textContent='切断されました'});
  call.on('error',e=>{$('viewStatus').textContent='映像接続エラー: '+(e.type||e.message||e)});
});
peer.on('error',e=>{$('viewStatus').textContent='接続エラー: '+(e.type||e.message||e)})}</script></body></html>
