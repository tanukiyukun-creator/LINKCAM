<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKCAM</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>body{margin:0;font-family:system-ui,sans-serif;background:#07111f;color:#fff;min-height:100vh}main{max-width:720px;margin:auto;padding:28px 18px}h1{font-size:34px;margin:0 0 6px}.sub{opacity:.7;margin-bottom:26px}.card{background:#101d30;border:1px solid #22334b;border-radius:18px;padding:20px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #334963;background:#091524;color:#fff;font-size:16px}button{margin-top:10px;background:#1d6cff;border:0;font-weight:700}button:disabled{opacity:.45}.hidden{display:none}.status{margin-top:12px;opacity:.75}.code{font-size:28px;letter-spacing:4px;font-weight:800;text-align:center;padding:16px}.video{width:100%;background:#000;border-radius:14px;max-height:70vh}.small{font-size:13px;opacity:.6}</style></head><body><main><h1>LINKCAM</h1><div class="sub">iPadをカメラにして、スマホ・PCから見る</div><div id="setup" class="card"><h2>端末を選択</h2><button onclick="showCamera()">この端末をカメラにする</button><button onclick="showViewer()">カメラ映像を見る</button></div><div id="camera" class="card hidden"><h2>カメラ登録</h2><input id="camName" placeholder="例：iPad・リビング"><button onclick="startCamera()">登録してカメラ開始</button><div id="camStatus" class="status"></div><div id="myCode" class="code hidden"></div><div class="small">この画面はカメラ待機用です。Safariのカメラ表示・システム表示は端末側の仕様により消せません。</div></div><div id="viewer" class="card hidden"><h2>カメラを見る</h2><input id="peerId" placeholder="iPadに表示された接続コード"><button onclick="connectViewer()">接続</button><div id="viewStatus" class="status"></div><video id="remote" class="video" autoplay playsinline controls></video></div></main><script>let peer,stream,call;const $=id=>document.getElementById(id);function showCamera(){$('setup').classList.add('hidden');$('camera').classList.remove('hidden')}function showViewer(){$('setup').classList.add('hidden');$('viewer').classList.remove('hidden')}function startCamera(){const name=$('camName').value.trim()||'iPad';$('camStatus').textContent='カメラを起動しています…';peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',id=>{$('camStatus').textContent=name+' として待機中';$('myCode').textContent=id;$('myCode').classList.remove('hidden')});peer.on('error',e=>{$('camStatus').textContent='接続エラー: '+e.type});navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s;peer.on('call',c=>{c.answer(stream);})}).catch(e=>{$('camStatus').textContent='カメラを使用できません: '+e.message})}function connectViewer(){const id=$('peerId').value.trim();if(!id)return;$('viewStatus').textContent='接続しています…';peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',()=>{call=peer.call(id,new MediaStream());call.on('stream',s=>{$('remote').srcObject=s;$('viewStatus').textContent='接続しました'});call.on('close',()=>{$('viewStatus').textContent='切断されました'});});peer.on('error',e=>{$('viewStatus').textContent='接続エラー: '+e.type})}</script></body></html>
