<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKCAM</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;font-family:system-ui,sans-serif;background:#07111f;color:#fff;min-height:100vh}main{max-width:760px;margin:auto;padding:28px 18px}h1{font-size:34px;margin:0 0 6px}.sub{opacity:.7;margin-bottom:26px}.card{background:#101d30;border:1px solid #22334b;border-radius:18px;padding:20px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #334963;background:#091524;color:#fff;font-size:16px}button{margin-top:10px;background:#1d6cff;border:0;font-weight:700}button.secondary{background:#26384f}.hidden{display:none}.status{margin-top:12px;opacity:.8}.qr{background:#fff;padding:14px;border-radius:14px;width:max-content;margin:18px auto}.video{width:100%;background:#000;border-radius:14px;max-height:70vh}.small{font-size:13px;opacity:.6;line-height:1.6}.device{font-size:20px;font-weight:700;text-align:center;margin-top:12px}#reader{margin-top:14px;border-radius:14px;overflow:hidden}</style></head><body><main><h1>LINKCAM</h1><div class="sub">iPadをカメラにして、スマホ・PCから見る</div><div id="setup" class="card"><h2>端末を選択</h2><button onclick="showCamera()">この端末をカメラにする</button><button onclick="showViewer()">カメラ映像を見る</button></div><div id="camera" class="card hidden"><h2>カメラ登録</h2><input id="camName" placeholder="例：iPad・リビング"><button onclick="startCamera()">登録してカメラ開始</button><div id="camStatus" class="status"></div><div id="camDevice" class="device hidden"></div><div id="qrWrap" class="qr hidden"><div id="qrcode"></div></div><div class="small">このQRコードを、見る側のLINKCAMで読み取ってください。カメラ端末はこのページを開いたままにしてください。</div></div><div id="viewer" class="card hidden"><h2>カメラを見る</h2><button onclick="startScanner()">📷 QRコードを読み取る</button><div id="reader" class="hidden"></div><input id="peerId" placeholder="QRを使わない場合のみ入力"><button class="secondary" onclick="connectViewer()">接続</button><div id="viewStatus" class="status"></div><div id="viewDevice" class="device hidden"></div><video id="remote" class="video" autoplay playsinline></video></div></main><script>
let peer,stream,scanner,scannerRunning=false,connected=false;const $=id=>document.getElementById(id);const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]};
function showCamera(){$('setup').classList.add('hidden');$('camera').classList.remove('hidden')}function showViewer(){$('setup').classList.add('hidden');$('viewer').classList.remove('hidden')}
function startCamera(){if(peer)return;const name=$('camName').value.trim()||'iPad';$('camStatus').textContent='カメラを起動しています…';navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s;peer=new Peer(undefined,{config:ice,debug:1});peer.on('open',id=>{const payload=JSON.stringify({v:1,id:id,name:name});$('camStatus').textContent='待機中。QRコードを読み取ってください';$('camDevice').textContent=name;$('camDevice').classList.remove('hidden');$('qrWrap').classList.remove('hidden');$('qrcode').innerHTML='';new QRCode($('qrcode'),{text:payload,width:230,height:230,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});});peer.on('connection',conn=>{conn.on('open',()=>{conn.send({type:'camera',name:name});const c=peer.call(conn.peer,stream,{metadata:{name:name}});c.on('error',e=>$('camStatus').textContent='映像接続エラー: '+e.type);});});peer.on('error',e=>$('camStatus').textContent='接続エラー: '+e.type);}).catch(e=>{$('camStatus').textContent='カメラを使用できません: '+e.message})}
async function startScanner(){if(scannerRunning)return;$('reader').classList.remove('hidden');scanner=new Html5Qrcode('reader');scannerRunning=true;try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async text=>{await stopScanner();try{const d=JSON.parse(text);if(!d.id)throw Error();$('peerId').value=d.id;if(d.name){$('viewDevice').textContent=d.name;$('viewDevice').classList.remove('hidden')}connectViewer();}catch(e){$('viewStatus').textContent='このQRコードはLINKCAM用ではありません';}} ,()=>{});}catch(e){scannerRunning=false;$('viewStatus').textContent='QR読み取り用カメラを起動できません: '+e.message}}
async function stopScanner(){if(scanner&&scannerRunning){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}}scannerRunning=false;$('reader').classList.add('hidden')}
function connectViewer(){const id=$('peerId').value.trim();if(!id){$('viewStatus').textContent='QRコードを読み取ってください';return}if(peer&&!peer.destroyed)try{peer.destroy()}catch(e){}$('viewStatus').textContent='カメラ端末を探しています…';peer=new Peer(undefined,{config:ice,debug:1});peer.on('open',myId=>{const conn=peer.connect(id,{reliable:true,metadata:{role:'viewer'}});let done=false;conn.on('open',()=>{$('viewStatus').textContent='カメラに接続。映像を待っています…'});conn.on('data',data=>{if(data&&data.type==='camera'&&!done){done=true;if(data.name){$('viewDevice').textContent=data.name;$('viewDevice').classList.remove('hidden')}}});conn.on('error',e=>$('viewStatus').textContent='通信エラー: '+e.type);setTimeout(()=>{if(!done&&$('remote').srcObject==null)$('viewStatus').textContent='接続できませんでした。カメラ側が待機中か確認してください。'},15000)});peer.on('call',call=>{call.answer();call.on('stream',s=>{$('remote').srcObject=s;$('viewStatus').textContent='接続しました。映像を表示中';$('remote').play().catch(()=>{})});call.on('close',()=>{$('viewStatus').textContent='カメラとの接続が切れました'});call.on('error',e=>$('viewStatus').textContent='映像接続エラー: '+e.type)});peer.on('error',e=>$('viewStatus').textContent='接続エラー: '+e.type)}
</script></body></html>
