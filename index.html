<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKCAM</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;font-family:system-ui,sans-serif;background:#07111f;color:#fff;min-height:100vh}main{max-width:720px;margin:auto;padding:24px 16px}.card{background:#101d30;border:1px solid #263a55;border-radius:18px;padding:20px;margin:14px 0}h1{font-size:34px;margin:0}.sub{opacity:.7;margin:5px 0 24px}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #334963;background:#091524;color:#fff;font-size:16px}button{margin-top:10px;background:#1d6cff;border:0;font-weight:700}.hidden{display:none}.status{margin-top:12px;line-height:1.5}.qr{background:#fff;padding:14px;width:max-content;margin:18px auto;border-radius:12px}.video{width:100%;background:#000;border-radius:14px;max-height:70vh}.back{background:#24344b}.small{font-size:13px;opacity:.65}.reader{margin-top:16px;border-radius:14px;overflow:hidden}</style></head><body><main><h1>LINKCAM</h1><div class="sub">iPadをカメラにして、スマホ・PCから見る</div><section id="home" class="card"><button onclick="show('camera')">この端末をカメラにする</button><button onclick="show('viewer')">カメラ映像を見る</button></section><section id="camera" class="card hidden"><h2>カメラ登録</h2><input id="camName" placeholder="例：iPad・リビング"><button onclick="startCamera()">登録してカメラ開始</button><div id="camStatus" class="status"></div><div id="qr" class="qr hidden"></div><div class="small">このQRを「カメラ映像を見る」側で読み取ります。</div><button class="back" onclick="show('home')">戻る</button></section><section id="viewer" class="card hidden"><h2>カメラを見る</h2><button onclick="startScanner()">📷 QRコードを読み取る</button><div id="reader" class="reader hidden"></div><div id="viewStatus" class="status"></div><video id="remote" class="video" autoplay playsinline controls></video><button class="back" onclick="stopScanner();show('home')">戻る</button></section></main><script>let peer=null,stream=null,scanner=null,call=null;const $=id=>document.getElementById(id);const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]};function show(which){['home','camera','viewer'].forEach(x=>$(x).classList.toggle('hidden',x!==which));if(which!=='viewer')stopScanner()}function makeQR(id,name){$('qr').innerHTML='';new QRCode($('qr'),{text:'LINKCAM|1|'+id+'|'+encodeURIComponent(name),width:220,height:220});$('qr').classList.remove('hidden')}async function startCamera(){const name=$('camName').value.trim()||'iPad';$('camStatus').textContent='カメラを起動しています…';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});peer=new Peer(undefined,{config:ice});peer.on('open',id=>{makeQR(id,name);$('camStatus').textContent='「'+name+'」として待機中。QRを読み取ってください。'});peer.on('call',c=>{c.answer(stream);$('camStatus').textContent='「'+name+'」が映像を送信中';});peer.on('error',e=>$('camStatus').textContent='接続エラー: '+e.type)}catch(e){$('camStatus').textContent='カメラを使用できません: '+e.message}}function startScanner(){stopScanner();$('reader').classList.remove('hidden');$('viewStatus').textContent='LINKCAMのQRコードを映してください。';scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},decoded=>{if(!decoded.startsWith('LINKCAM|1|')){ $('viewStatus').textContent='これはLINKCAMのQRコードではありません。';return}const p=decoded.split('|');if(p.length<4){$('viewStatus').textContent='QR情報が壊れています。';return}const id=p[2],name=decodeURIComponent(p.slice(3).join('|'));stopScanner();connectViewer(id,name)},()=>{}).catch(e=>$('viewStatus').textContent='QR読み取りを開始できません: '+e)}function stopScanner(){if(scanner){scanner.stop().catch(()=>{});scanner.clear().catch(()=>{});scanner=null}$('reader').classList.add('hidden')}function connectViewer(id,name){$('viewStatus').textContent='「'+name+'」に接続しています…';peer=new Peer(undefined,{config:ice});peer.on('open',()=>{call=peer.call(id,stream||new MediaStream());if(!call){$('viewStatus').textContent='映像接続を開始できませんでした。';return}call.on('stream',s=>{$('remote').srcObject=s;$('viewStatus').textContent='「'+name+'」に接続しました';$('remote').play().catch(()=>{})});call.on('close',()=>$('viewStatus').textContent='接続が切れました');call.on('error',e=>$('viewStatus').textContent='映像接続エラー: '+e)});peer.on('error',e=>$('viewStatus').textContent='接続エラー: '+e.type)} </script></body></html>
