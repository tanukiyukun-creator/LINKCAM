<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LINKCAM</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff;min-height:100vh}main{width:min(720px,100%);margin:auto;padding:28px 18px 40px}h1{font-size:36px;margin:0 0 4px;letter-spacing:1px}.sub{opacity:.7;margin-bottom:24px}.card{background:#101d30;border:1px solid #22334b;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 12px 30px #0003}h2{margin-top:0}input,button{width:100%;padding:15px;border-radius:13px;border:1px solid #334963;background:#091524;color:#fff;font-size:16px}button{margin-top:10px;background:#1d6cff;border:0;font-weight:700;cursor:pointer}button.secondary{background:#1a2a40}.hidden{display:none}.status{margin-top:12px;opacity:.8;line-height:1.5}.qrwrap{display:flex;justify-content:center;margin:18px 0}.qrbox{background:#fff;padding:14px;border-radius:16px;min-width:242px;min-height:242px;display:flex;align-items:center;justify-content:center}.qrtitle{text-align:center;font-weight:700;margin-top:18px}.name{text-align:center;font-size:21px;font-weight:800;margin:8px 0}.video{width:100%;background:#000;border-radius:14px;max-height:70vh}.small{font-size:13px;opacity:.6;line-height:1.5}.back{background:#1a2a40}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#172942;font-size:12px;opacity:.8}
</style>
</head>
<body>
<main>
<h1>LINKCAM</h1>
<div class="sub">QRコードでカメラ端末へ接続</div>

<div id="setup" class="card">
<h2>端末を選択</h2>
<button onclick="showCamera()">この端末をカメラにする</button>
<button class="secondary" onclick="showViewer()">カメラ映像を見る</button>
</div>

<div id="camera" class="card hidden">
<h2>カメラ登録</h2>
<input id="camName" placeholder="例：iPad・リビング">
<button onclick="startCamera()">登録してカメラ開始</button>
<div id="camStatus" class="status"></div>
<div id="camNameDisplay" class="name hidden"></div>
<div id="qrTitle" class="qrtitle hidden">このQRコードを、見る側の端末で読み取ってください</div>
<div id="qrWrap" class="qrwrap hidden"><div id="qrcode" class="qrbox"></div></div>
<div class="small">QRコードには、このカメラへ接続するための情報だけが入ります。接続後、見る側にはカメラ映像が表示されます。</div>
</div>

<div id="viewer" class="card hidden">
<h2>カメラを見る</h2>
<div id="cameraNameFromQR" class="pill hidden"></div>
<input id="peerId" placeholder="必要な場合のみ接続IDを入力">
<button onclick="connectViewer()">接続</button>
<div id="viewStatus" class="status"></div>
<video id="remote" class="video" autoplay playsinline controls></video>
</div>

</main>
<script>
let peer=null,stream=null,call=null;
const $=id=>document.getElementById(id);
function showCamera(){ $('setup').classList.add('hidden'); $('viewer').classList.add('hidden'); $('camera').classList.remove('hidden'); $('camName').value=localStorage.getItem('linkcam-camera-name')||''; }
function showViewer(){ $('setup').classList.add('hidden'); $('camera').classList.add('hidden'); $('viewer').classList.remove('hidden'); }
function startCamera(){
 const name=$('camName').value.trim()||'iPad';
 localStorage.setItem('linkcam-camera-name',name);
 $('camStatus').textContent='カメラを起動しています…';
 peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
 peer.on('open',id=>{
   $('camStatus').textContent=name+' として待機中';
   $('camNameDisplay').textContent=name;
   $('camNameDisplay').classList.remove('hidden');
   makeQR(id,name);
 });
 peer.on('call',c=>{ if(stream){ c.answer(stream); call=c; } });
 peer.on('error',e=>{ $('camStatus').textContent='接続エラー: '+(e.type||e.message); });
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})
 .then(s=>{stream=s;})
 .catch(e=>{ $('camStatus').textContent='カメラを使用できません: '+e.message; });
}
function makeQR(id,name){
 const url=new URL(location.href);
 url.search='';url.hash='';
 url.searchParams.set('camera',id);url.searchParams.set('name',name);
 $('qrcode').innerHTML='';
 new QRCode($('qrcode'),{text:url.toString(),width:210,height:210,correctLevel:QRCode.CorrectLevel.M});
 $('qrTitle').classList.remove('hidden');$('qrWrap').classList.remove('hidden');
}
function connectViewer(){
 const id=$('peerId').value.trim();
 if(!id)return;
 doConnect(id,$('cameraNameFromQR').textContent||'');
}
function doConnect(id,name){
 $('viewStatus').textContent='接続しています…';
 peer=new Peer(undefined,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});
 peer.on('open',()=>{
   call=peer.call(id,new MediaStream());
   call.on('stream',s=>{$('remote').srcObject=s;$('viewStatus').textContent='接続しました';});
   call.on('close',()=>{$('viewStatus').textContent='切断されました';});
   call.on('error',e=>{$('viewStatus').textContent='接続エラー: '+(e.type||e.message);});
 });
 peer.on('error',e=>{$('viewStatus').textContent='接続エラー: '+(e.type||e.message);});
}
function autoFromQR(){
 const p=new URLSearchParams(location.search);const id=p.get('camera');const name=p.get('name');
 if(!id)return;
 showViewer();
 if(name){$('cameraNameFromQR').textContent=name;$('cameraNameFromQR').classList.remove('hidden');}
 $('peerId').value=id;
 doConnect(id,name||'');
}
window.addEventListener('load',autoFromQR);
</script>
</body>
</html>
