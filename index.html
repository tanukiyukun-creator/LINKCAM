<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINKCAM</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;font-family:system-ui,sans-serif;background:#07111f;color:#fff;min-height:100vh}main{max-width:760px;margin:auto;padding:28px 18px}h1{font-size:34px;margin:0 0 6px}.sub{opacity:.7;margin-bottom:26px}.card{background:#101d30;border:1px solid #22334b;border-radius:18px;padding:20px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #334963;background:#091524;color:#fff;font-size:16px}button{margin-top:10px;background:#1d6cff;border:0;font-weight:700}button.secondary{background:#26384f}.hidden{display:none}.status{margin-top:12px;line-height:1.6}.qr{background:#fff;padding:14px;border-radius:14px;width:max-content;margin:18px auto}.video{width:100%;background:#000;border-radius:14px;max-height:70vh}.small{font-size:13px;opacity:.65;line-height:1.6}.device{font-size:20px;font-weight:700;text-align:center;margin-top:12px}#reader{margin-top:14px;border-radius:14px;overflow:hidden}.ok{color:#8ee6a8}.err{color:#ff9999}.log{font-size:12px;opacity:.65;white-space:pre-wrap;margin-top:10px}</style></head><body><main><h1>LINKCAM</h1><div class="sub">iPad・スマホをカメラにして、別の端末から見る</div><div id="setup" class="card"><h2>端末を選択</h2><button onclick="showCamera()">この端末をカメラにする</button><button onclick="showViewer()">カメラ映像を見る</button></div><div id="camera" class="card hidden"><h2>カメラ登録</h2><input id="camName" placeholder="例：iPad・リビング"><button onclick="startCamera()">登録してカメラ開始</button><div id="camStatus" class="status"></div><div id="camDevice" class="device hidden"></div><div id="qrWrap" class="qr hidden"><div id="qrcode"></div></div><div class="small">見る側でこのQRコードを読み取ってください。このページは閉じず、カメラの許可を維持してください。</div><div id="camLog" class="log"></div></div><div id="viewer" class="card hidden"><h2>カメラを見る</h2><button onclick="startScanner()">📷 QRコードを読み取る</button><div id="reader" class="hidden"></div><input id="peerId" placeholder="QR読み取り済みなら不要"><button class="secondary" onclick="connectViewer()">接続</button><div id="viewStatus" class="status"></div><div id="viewDevice" class="device hidden"></div><video id="remote" class="video" autoplay playsinline controls></video><div id="viewLog" class="log"></div></div></main><script>
let peer=null,stream=null,scanner=null,scannerRunning=false,currentCall=null,currentConn=null;
const $=id=>document.getElementById(id);
const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}],sdpSemantics:'unified-plan'};
function showCamera(){$('setup').classList.add('hidden');$('camera').classList.remove('hidden')}
function showViewer(){$('setup').classList.add('hidden');$('viewer').classList.remove('hidden')}
function log(el,msg){$(el).textContent+=new Date().toLocaleTimeString()+' '+msg+'\n'}
function setStatus(el,msg,cls=''){$(el).textContent=msg;$(el).className='status '+cls}
function startCamera(){if(peer){setStatus('camStatus','すでにカメラとして待機しています','ok');return}const name=$('camName').value.trim()||'iPad';setStatus('camStatus','カメラを起動しています…');navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}).then(s=>{stream=s;setStatus('camStatus','通信サーバーへ接続しています…');peer=new Peer(undefined,{config:ice,debug:2});peer.on('open',id=>{const payload=JSON.stringify({v:2,id,name});$('camDevice').textContent=name;$('camDevice').classList.remove('hidden');$('qrWrap').classList.remove('hidden');$('qrcode').innerHTML='';new QRCode($('qrcode'),{text:payload,width:240,height:240,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});setStatus('camStatus','待機中。QRコードを読み取ってください','ok');log('camLog','Peer ID: '+id)});peer.on('connection',conn=>{currentConn=conn;log('camLog','見る側から接続要求: '+conn.peer);conn.on('open',()=>{setStatus('camStatus','見る側と接続しました。映像を送信します','ok');conn.send({type:'camera-ready',name});setTimeout(()=>sendVideo(conn.peer,name),250)});conn.on('data',data=>{if(data&&data.type==='request-video')sendVideo(conn.peer,name)});conn.on('close',()=>{setStatus('camStatus','見る側との接続が終了。待機中','ok')});conn.on('error',e=>log('camLog','Data error: '+(e.type||e.message)))});peer.on('disconnected',()=>{setStatus('camStatus','通信サーバーとの接続が切れました。再接続中…','err');try{peer.reconnect()}catch(e){}});peer.on('error',e=>{setStatus('camStatus','接続エラー: '+e.type,'err');log('camLog','Peer error: '+e.type)});}).catch(e=>setStatus('camStatus','カメラを使用できません: '+e.message,'err'))}
function sendVideo(viewerId,name){if(!peer||!stream)return;try{const call=peer.call(viewerId,stream,{metadata:{name}});currentCall=call;log('camLog','映像呼び出し送信');call.on('error',e=>{setStatus('camStatus','映像接続エラー: '+e.type,'err');log('camLog','Media error: '+e.type)});call.on('close',()=>log('camLog','映像接続終了'))}catch(e){log('camLog','call失敗: '+e.message)}}
async function startScanner(){if(scannerRunning)return;$('reader').classList.remove('hidden');scanner=new Html5Qrcode('reader');scannerRunning=true;try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},async text=>{try{const d=JSON.parse(text);if(!d.id)throw Error('IDなし');$('peerId').value=d.id;if(d.name){$('viewDevice').textContent=d.name;$('viewDevice').classList.remove('hidden')}setStatus('viewStatus','QRを読み取りました。カメラ端末へ接続します…','ok');await stopScanner();connectViewer()}catch(e){setStatus('viewStatus','LINKCAMのQRコードではありません','err')}} ,()=>{});}catch(e){scannerRunning=false;setStatus('viewStatus','QR読み取り用カメラを起動できません: '+e.message,'err')}}
async function stopScanner(){if(scanner&&scannerRunning){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}}scannerRunning=false;$('reader').classList.add('hidden')}
function connectViewer(){const id=$('peerId').value.trim();if(!id){setStatus('viewStatus','先にQRコードを読み取ってください','err');return}if(peer){try{peer.destroy()}catch(e){}}$('remote').srcObject=null;setStatus('viewStatus','通信サーバーへ接続しています…');peer=new Peer(undefined,{config:ice,debug:2});peer.on('open',myId=>{log('viewLog','自分のPeer ID: '+myId);setStatus('viewStatus','カメラ端末を探しています…');const conn=peer.connect(id,{reliable:true,metadata:{role:'viewer'}});currentConn=conn;conn.on('open',()=>{setStatus('viewStatus','カメラ端末を発見。映像接続を開始します…','ok');conn.send({type:'request-video'});});conn.on('data',data=>{if(data&&data.type==='camera-ready'){setStatus('viewStatus','カメラが応答しました。映像を待っています…','ok');conn.send({type:'request-video'})}});conn.on('error',e=>{setStatus('viewStatus','データ接続エラー: '+e.type,'err');log('viewLog','Data error: '+e.type)});conn.on('close',()=>log('viewLog','Data connection closed'))});peer.on('call',call=>{currentCall=call;log('viewLog','映像呼び出しを受信');call.answer();call.on('stream',s=>{$('remote').srcObject=s;$('remote').muted=true;$('remote').play().then(()=>{$('remote').muted=false}).catch(()=>{});setStatus('viewStatus','接続しました。映像を表示中','ok')});call.on('error',e=>{setStatus('viewStatus','映像接続エラー: '+e.type,'err');log('viewLog','Media error: '+e.type)});call.on('close',()=>setStatus('viewStatus','映像接続が終了しました','err'))});peer.on('disconnected',()=>{setStatus('viewStatus','通信サーバーとの接続が切れました','err');try{peer.reconnect()}catch(e){}});peer.on('error',e=>{setStatus('viewStatus','接続エラー: '+e.type,'err');log('viewLog','Peer error: '+e.type)});setTimeout(()=>{if(!$('remote').srcObject)setStatus('viewStatus','15秒経過。カメラ側がこのページを開いたままか確認してください。','err')},15000)}
</script></body></html>
